<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Log in')}"></head>
<body>
<header th:replace="~{fragments :: navbar}"></header>
<main class="container">
  <form class="panel narrow" th:action="@{/login}" method="post">
    <h1>Log in</h1>
    <p class="alert err" th:if="${param.error}" role="alert">Wrong email or password, or your account is disabled.</p>
    <p class="alert ok" th:if="${param.logout}" role="status">You've been logged out.</p>
    <p class="alert ok" th:if="${param.registered}" role="status">Account created. Log in to continue.</p>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus autocomplete="username">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">
    <p><button class="btn" type="submit">Log in</button></p>
    <p class="muted">New here? <a th:href="@{/register}">Create an account</a></p>
  </form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
