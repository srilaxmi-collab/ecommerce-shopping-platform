<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head(${product.name})}"></head>
<body>
<header th:replace="~{fragments :: navbar}"></header>
<main class="container">
  <div th:replace="~{fragments :: flash}"></div>
  <p><a th:href="@{/products}">&larr; All products</a></p>
  <section class="detail">
    <div class="media">
      <img th:if="${product.imageUrl != null}" th:src="@{${product.imageUrl}}" th:alt="${product.name}">
      <span th:unless="${product.imageUrl != null}" class="ph" aria-hidden="true" th:text="${#strings.substring(product.name, 0, 1)}">A</span>
    </div>
    <div>
      <span class="tag" th:if="${product.category != null}" th:text="${product.category.name}">Category</span>
      <h1 th:text="${product.name}">Product</h1>
      <p th:if="${avgRating != null}"><span class="stars" th:text="${#strings.repeat('★', T(java.lang.Math).round(avgRating).intValue())}">★★★★</span>
        <span class="muted" th:text="${avgRating} + ' out of 5 (' + ${#lists.size(reviews)} + ' reviews)'">4.5</span></p>
      <p><span th:replace="~{fragments :: price(${product.price})}"></span></p>
      <p th:text="${product.description}">Description</p>
      <p class="stock-out" th:if="${product.stock == 0}">Out of stock</p>
      <p class="stock-low" th:if="${product.stock > 0 and product.stock <= 5}" th:text="'Only ' + ${product.stock} + ' left'">Only 3 left</p>

      <form th:if="${product.stock > 0}" sec:authorize="isAuthenticated()" th:action="@{/cart/add}" method="post">
        <input type="hidden" name="productId" th:value="${product.id}">
        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" name="quantity" value="1" min="1" th:max="${product.stock}" style="width:90px">
        <p><button class="btn" type="submit">Add to cart</button></p>
      </form>
      <p th:if="${product.stock > 0}" sec:authorize="!isAuthenticated()"><a class="btn" th:href="@{/login}">Log in to add to cart</a></p>
    </div>
  </section>

  <section class="panel" style="margin-top:1.5rem">
    <h2>Reviews</h2>
    <p class="muted" th:if="${#lists.isEmpty(reviews)}">No reviews yet.</p>
    <div class="review" th:each="r : ${reviews}">
      <span class="stars" th:text="${#strings.repeat('★', r.rating)}">★★★★★</span>
      <strong th:text="${r.user.firstName}">Name</strong>
      <span class="muted" th:text="${#temporals.format(r.createdAt, 'dd MMM yyyy')}">date</span>
      <p th:if="${r.comment != null and !#strings.isEmpty(r.comment)}" th:text="${r.comment}">Comment</p>
    </div>
    <form sec:authorize="isAuthenticated()" th:action="@{/products/{id}/reviews(id=${product.id})}" method="post">
      <h3>Write a review</h3>
      <label for="rating">Rating</label>
      <select id="rating" name="rating" style="width:auto">
        <option value="5">5 – Excellent</option><option value="4">4 – Good</option><option value="3">3 – Okay</option>
        <option value="2">2 – Poor</option><option value="1">1 – Terrible</option>
      </select>
      <label for="comment">Comment</label>
      <textarea id="comment" name="comment" maxlength="1000"></textarea>
      <p><button class="btn" type="submit">Post review</button></p>
    </form>
    <p sec:authorize="!isAuthenticated()"><a th:href="@{/login}">Log in</a> to write a review.</p>
  </section>

  <section th:if="${!#lists.isEmpty(related)}" style="margin-top:1.5rem">
    <h2>More in this category</h2>
    <div class="grid"><th:block th:each="p : ${related}"><div th:replace="~{fragments :: productCard(${p})}"></div></th:block></div>
  </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
