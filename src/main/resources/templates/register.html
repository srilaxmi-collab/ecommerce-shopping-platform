<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Create account')}"></head>
<body>
<header th:replace="~{fragments :: navbar}"></header>
<main class="container">
  <form class="panel narrow" th:action="@{/register}" th:object="${user}" method="post">
    <h1>Create your account</h1>
    <label for="firstName">First name</label>
    <input type="text" id="firstName" th:field="*{firstName}" autocomplete="given-name">
    <p class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>
    <label for="lastName">Last name</label>
    <input type="text" id="lastName" th:field="*{lastName}" autocomplete="family-name">
    <p class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>
    <label for="email">Email</label>
    <input type="email" id="email" th:field="*{email}" autocomplete="username">
    <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
    <label for="password">Password</label>
    <input type="password" id="password" th:field="*{password}" autocomplete="new-password">
    <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
    <p><button class="btn" type="submit">Create account</button></p>
    <p class="muted">Already registered? <a th:href="@{/login}">Log in</a></p>
  </form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
